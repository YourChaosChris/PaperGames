<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary" data-i18n="maumau_mode_hotseat">Same device</button>
      <button id="mode-offline-ai" class="mode-btn secondary active-mode" data-i18n="vs_computer">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-schwimmen-game" class="primary" data-i18n="new_game">New game</button>
    <label for="schwimmen-num-players" data-i18n="maumau_num_players">Players:</label>
    <select id="schwimmen-num-players">
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    <span id="schwimmen-level-wrap">
      <select id="schwimmen-level-inline">
        <option value="1" data-i18n="level_easy">Easy</option>
        <option value="2" selected data-i18n="level_medium">Medium</option>
        <option value="3" data-i18n="level_hard">Hard</option>
      </select>
    </span>
  </div>
  <div id="offline-schwimmen-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="14" y="8" width="56" height="78" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><rect x="32" y="16" width="56" height="78" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><text x="60" y="66" text-anchor="middle" font-size="30" font-weight="700" font-family="sans-serif" fill="#141413">31</text></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_schwimmen">Thirty-One</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="schwimmen-players" class="game-players" role="status" aria-live="polite"></div>
    <div class="pc-row">
      <span class="pc-row-label" data-i18n="schwimmen_middle_label">Middle</span>
      <div id="schwimmen-table"></div>
    </div>
    <div id="schwimmen-hand-cover" class="hand-cover hidden">
      <p id="schwimmen-hand-cover-text"></p>
      <button id="schwimmen-show-hand" class="primary" type="button" data-i18n="maumau_show_hand">Show my cards</button>
    </div>
    <div id="schwimmen-hand-wrap" class="pc-row">
      <span class="pc-row-label" data-i18n="schwimmen_hand_label">Your cards</span>
      <div id="schwimmen-hand" role="group" data-i18n-attr="aria-label:schwimmen_hand_label" aria-label="Your cards"></div>
      <div id="schwimmen-score" class="pc-score"></div>
    </div>
    <div id="schwimmen-all-hands"></div>
    <div id="schwimmen-actions" class="game-actions-row hidden">
      <button id="schwimmen-swap-all" class="secondary" type="button" data-i18n="schwimmen_swap_all">Swap all</button>
      <button id="schwimmen-pass" class="secondary" type="button" data-i18n="schwimmen_pass">Pass</button>
      <button id="schwimmen-knock" class="secondary" type="button" data-i18n="schwimmen_knock">Knock</button>
    </div>
    <div class="game-actions-row">
      <button id="schwimmen-next-round" class="primary hidden" type="button" data-i18n="schwimmen_next_round">Next round</button>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="resign-button" class="secondary small hidden" data-i18n="resign_button">Resign 🏳</button>
  </div>
</section>
