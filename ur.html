<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eInkChess – Royal Game of Ur for E‑Ink</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="title-wrap app-title-row">
      <h1><a href="index.html" class="app-title-link">♞ eInkChess</a></h1>
      <a href="about.html" class="app-title-author app-title-author-link">by Christopher Müller</a>
    </div>
    <div class="user-panel">
      <button id="menu-toggle" class="secondary">&#9776; Menu</button>
    </div>
  </header>

  <main>

<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary">2 Player</button>
      <button id="mode-offline-ai" class="mode-btn secondary">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card hidden">
  <div class="field-row">
    <button id="start-ur-game" class="primary">New game</button>
    <div id="ur-color-choice" class="inline-options">
      <label class="color-choice"><input type="radio" name="ur-color" value="black" checked> <span class="color-choice-icon"><span class="ur-piece-icon ur-piece-icon-black"></span></span></label>
      <label class="color-choice"><input type="radio" name="ur-color" value="white"> <span class="color-choice-icon"><span class="ur-piece-icon ur-piece-icon-white"></span></span></label>
    </div>
    <select id="ur-level-inline">
        <option value="0">2 Player</option>
        <option value="1">Easy</option>
        <option value="2" selected>Medium</option>
        <option value="3">Hard</option>
      </select>
  </div>
  <div id="offline-ur-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result"></div>

    <div id="board-info" class="status-text"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon"><span class="ur-piece-icon ur-piece-icon-black"></span></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_ur">Ur</span>
      <span class="board-placeholder-subtitle">eInkChess</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="ur-tray-top" class="ur-tray">
      <button id="ur-tray-top-start" class="ur-tray-slot" type="button">
        <span class="ur-tray-slot-label" data-i18n="ur_tray_start">Start</span>
        <span id="ur-tray-top-start-count" class="ur-tray-slot-count"></span>
      </button>
      <div class="ur-tray-slot ur-tray-slot-static">
        <span class="ur-tray-slot-label" data-i18n="ur_tray_home">Home</span>
        <span id="ur-tray-top-home-count" class="ur-tray-slot-count"></span>
      </div>
    </div>
    <div id="ur-board" class="ur-board"></div>
    <div id="ur-tray-bottom" class="ur-tray">
      <button id="ur-tray-bottom-start" class="ur-tray-slot" type="button">
        <span class="ur-tray-slot-label" data-i18n="ur_tray_start">Start</span>
        <span id="ur-tray-bottom-start-count" class="ur-tray-slot-count"></span>
      </button>
      <div class="ur-tray-slot ur-tray-slot-static">
        <span class="ur-tray-slot-label" data-i18n="ur_tray_home">Home</span>
        <span id="ur-tray-bottom-home-count" class="ur-tray-slot-count"></span>
      </div>
    </div>
    <div id="ur-dice-area" class="ur-dice-area">
      <button id="ur-roll-button" class="primary" type="button" data-i18n="ur_roll_dice">Roll dice</button>
      <div id="ur-dice-display" class="ur-dice-display"></div>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="undo-btn" class="secondary small hidden" onclick="undoLastMove()">Undo</button>
    <button id="resign-button" class="secondary small hidden">Resign 🏳</button>
  </div>
</section>
  </main>
</div>

<script src="i18n.js"></script>
<script src="ur-core.js"></script>
<script src="ur-ai.js"></script>
<script src="result-modal.js"></script>
<script src="game-storage.js"></script>
<script src="game-stats.js"></script>
<script src="ur-app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
