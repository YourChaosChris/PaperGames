<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary" data-i18n="maumau_mode_hotseat">Same device</button>
      <button id="mode-offline-ai" class="mode-btn secondary active-mode" data-i18n="vs_computer">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-durak-game" class="primary" data-i18n="new_game">New game</button>
    <label for="durak-num-players" data-i18n="maumau_num_players">Players:</label>
    <select id="durak-num-players">
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    <span id="durak-level-wrap">
      <select id="durak-level-inline">
        <option value="1" data-i18n="level_easy">Easy</option>
        <option value="2" selected data-i18n="level_medium">Medium</option>
        <option value="3" data-i18n="level_hard">Hard</option>
      </select>
    </span>
    <label class="durak-rule-option"><input type="checkbox" id="durak-transfer-rule"> <span data-i18n="durak_transfer_option">Allow passing the attack on</span></label>
  </div>
  <div id="offline-durak-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="14" y="8" width="56" height="78" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><rect x="32" y="16" width="56" height="78" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><path d="M60 36 C60 36 44 48 44 58 C44 64 49 68 54 68 C57 68 59 66 60 64 L58 76 L62 76 L60 64 C61 66 63 68 66 68 C71 68 76 64 76 58 C76 48 60 36 60 36 Z" fill="#141413"/></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_durak">Durak</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="durak-trump" class="durak-trump" role="status"></div>
    <div id="durak-players" class="game-players" role="status" aria-live="polite"></div>
    <div class="pc-row">
      <span id="durak-table-info" class="pc-row-label"></span>
      <div id="durak-table" class="durak-table"></div>
    </div>
    <div id="durak-hand-cover" class="hand-cover hidden">
      <p id="durak-hand-cover-text"></p>
      <button id="durak-show-hand" class="primary" type="button" data-i18n="maumau_show_hand">Show my cards</button>
    </div>
    <div id="durak-hand" class="pc-row" role="group" data-i18n-attr="aria-label:schwimmen_hand_label" aria-label="Your cards"></div>
    <div class="game-actions-row">
      <button id="durak-take" class="secondary hidden" type="button" data-i18n="durak_take">Take the cards</button>
      <button id="durak-pass" class="secondary hidden" type="button" data-i18n="durak_pass">Pass</button>
      <button id="durak-transfer" class="secondary hidden" type="button" data-i18n="durak_transfer">Pass the attack on</button>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="resign-button" class="secondary small hidden" data-i18n="resign_button">Resign 🏳</button>
  </div>
</section>
