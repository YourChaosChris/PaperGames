<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PaperGames – Checkers for E‑Ink</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="title-wrap app-title-row">
      <h1><a href="index.html" class="app-title-link"><svg class="brand-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect x="20" y="19" width="72" height="72" rx="15" fill="#4a4947"/><rect x="14" y="13" width="72" height="72" rx="15" fill="#ffffff" stroke="#141413" stroke-width="3.5"/><rect x="20" y="19" width="15" height="15" fill="#141413"/><rect x="35" y="19" width="15" height="15" fill="#ffffff"/><rect x="50" y="19" width="15" height="15" fill="#141413"/><rect x="65" y="19" width="15" height="15" fill="#ffffff"/><rect x="20" y="34" width="15" height="15" fill="#ffffff"/><rect x="35" y="34" width="15" height="15" fill="#141413"/><rect x="50" y="34" width="15" height="15" fill="#ffffff"/><rect x="65" y="34" width="15" height="15" fill="#141413"/><rect x="20" y="49" width="15" height="15" fill="#141413"/><rect x="35" y="49" width="15" height="15" fill="#ffffff"/><rect x="50" y="49" width="15" height="15" fill="#141413"/><rect x="65" y="49" width="15" height="15" fill="#ffffff"/><rect x="20" y="64" width="15" height="15" fill="#ffffff"/><rect x="35" y="64" width="15" height="15" fill="#141413"/><rect x="50" y="64" width="15" height="15" fill="#ffffff"/><rect x="65" y="64" width="15" height="15" fill="#141413"/><g stroke="#141413" stroke-width="0.8"><line x1="35" y1="19" x2="35" y2="79"/><line x1="50" y1="19" x2="50" y2="79"/><line x1="65" y1="19" x2="65" y2="79"/><line x1="20" y1="34" x2="80" y2="34"/><line x1="20" y1="49" x2="80" y2="49"/><line x1="20" y1="64" x2="80" y2="64"/></g><rect x="20" y="19" width="60" height="60" fill="none" stroke="#141413" stroke-width="1.6"/></svg> PaperGames</a></h1>
      <a href="about.html" class="app-title-author app-title-author-link">by Christopher Müller</a>
    </div>
    <div class="user-panel">
      <button id="menu-toggle" class="secondary">&#9776; Menu</button>
    </div>
  </header>

  <main>

<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary">2 Player</button>
      <button id="mode-offline-ai" class="mode-btn secondary">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card hidden">
  <div class="field-row">
    <button id="start-checkers-game" class="primary">New game</button>
    <div id="checkers-color-choice" class="inline-options">
      <label class="color-choice"><input type="radio" name="checkers-color" value="black" checked> <span class="color-choice-icon"><span class="checkers-icon-disc checkers-icon-disc-black"></span></span></label>
      <label class="color-choice"><input type="radio" name="checkers-color" value="white"> <span class="color-choice-icon"><span class="checkers-icon-disc checkers-icon-disc-white"></span></span></label>
    </div>
    <select id="checkers-level-inline">
        <option value="0">2 Player</option>
        <option value="1">Easy</option>
        <option value="2" selected>Medium</option>
        <option value="3">Hard</option>
      </select>
  </div>
  <div id="offline-checkers-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon checkers-icon-disc checkers-icon-disc-black"></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_checkers">Checkers</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="checkers-board" role="group" aria-label="Checkers board"></div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="undo-btn" class="secondary small hidden" onclick="undoLastMove()">Undo</button>
    <button id="resign-button" class="secondary small hidden">Resign 🏳</button>
  </div>
  <div id="score-line" class="score-line hidden"><span id="score-captures" class="score-line-captures"></span></div>
</section>
  </main>
  <footer class="site-footer">
    <a href="impressum.html" data-i18n="nav_impressum">Legal Notice</a>
    <a href="datenschutz.html" data-i18n="nav_privacy">Privacy Policy</a>
  </footer>
</div>

<script src="i18n.js"></script>
<script src="checkers-core.js"></script>
<script src="checkers-ai.js"></script>
<script src="result-modal.js"></script>
<script src="game-storage.js"></script>
<script src="game-stats.js"></script>
<script src="board-a11y.js"></script>
<script src="checkers-app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
