<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yut (prototype)</title>
<style>
body{margin:0;padding:8px;background:#fff;color:#000;font:16px sans-serif;max-width:640px;margin:0 auto}
button,select{min-height:44px;font:inherit;border:2px solid #000;background:#fff;color:#000;padding:4px 10px;margin:2px}
button.on{background:#000;color:#fff}
button:disabled{opacity:.4}
svg{width:100%;height:auto;border:2px solid #000;display:block}
#status{font-weight:bold;min-height:2.6em;margin:6px 0}
</style>
<script src="yut-core.js"></script>
<script src="yut-ai.js"></script>
</head>
<body>
<div>
  <select id="np"><option>2</option><option>3</option><option>4</option></select>
  <select id="lv"><option value="1">1</option><option value="2" selected>2</option></select>
  <button id="new"></button>
</div>
<div id="status" aria-live="polite"></div>
<div id="acts"></div>
<svg id="b" viewBox="0 0 600 640"></svg>
<div id="info"></div>
<script>
(function(){
"use strict";
var de=/^de/.test(navigator.language||"");
var T=de?{nw:"Neues Spiel",thr:"Stäbe werfen",hint:"Tipp",wait:"Wartende Figur",done:"Ziel",wait2:"wartet",
 tt:"{p} wirft.",tm:"{p} zieht: Wurf wählen, dann Figur, dann Zielfeld.",win:"{p} gewinnt!",thrown:"{p} wirft {n} ({s}).",
 moved:"{p} zieht von {a} nach {b}.",cap:" Schlägt!",ring:"Ring",diag:"Abkürzung",players:"Figuren",lost:"Wurf verfällt."}:
 {nw:"New game",thr:"Throw sticks",hint:"Hint",wait:"Waiting piece",done:"home",wait2:"waiting",
 tt:"{p} throws.",tm:"{p} moves: choose a throw, then a piece, then a target.",win:"{p} wins!",thrown:"{p} throws {n} ({s}).",
 moved:"{p} moves from {a} to {b}.",cap:" Captures!",ring:"ring",diag:"shortcut",players:"Pieces",lost:"Throw is lost."};
var NAMES={"1":"do","2":"gae","3":"geol","4":"yut","5":"mo","-1":"backdo"};
var L=["A","B","C","D"];
function f(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k];});}
var C={0:[540,540]},i;
for(i=1;i<=4;i++)C[i]=[540,540-96*i];
C[5]=[540,60];
for(i=6;i<=9;i++)C[i]=[540-96*(i-5),60];
C[10]=[60,60];
for(i=11;i<=14;i++)C[i]=[60,60+96*(i-10)];
C[15]=[60,540];
for(i=16;i<=19;i++)C[i]=[60+96*(i-15),540];
C[20]=[460,140];C[21]=[380,220];C[22]=[300,300];C[23]=[220,380];C[24]=[140,460];
C[25]=[140,140];C[26]=[220,220];C[27]=[380,380];C[28]=[460,460];
var g,level=2,sel=0,from=null,hintMv=null,busy=false,msg="",$=function(id){return document.getElementById(id);};
function pos(pc){return pc.route.length?pc.route[pc.route.length-1]:-1;}
function human(){return g.turn===0;}
function shape(p,x,y,on){
  var fill=on?"#000":"#fff",ink=on?"#fff":"#000",s;
  if(p===0)s='<circle cx="'+x+'" cy="'+y+'" r="17" fill="'+fill+'" stroke="#000" stroke-width="3"/>';
  else if(p===1)s='<rect x="'+(x-16)+'" y="'+(y-16)+'" width="32" height="32" fill="'+fill+'" stroke="#000" stroke-width="3"/>';
  else if(p===2)s='<polygon points="'+x+','+(y-19)+' '+(x+18)+','+(y+15)+' '+(x-18)+','+(y+15)+'" fill="'+fill+'" stroke="#000" stroke-width="3"/>';
  else s='<polygon points="'+x+','+(y-20)+' '+(x+19)+','+y+' '+x+','+(y+20)+' '+(x-19)+','+y+'" fill="'+fill+'" stroke="#000" stroke-width="3"/>';
  return s+'<text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="16" font-weight="bold" fill="'+ink+'">'+L[p]+'</text>';
}
function curSteps(){return g.pending[Math.min(sel,g.pending.length-1)];}
function movesFor(){return g.pending.length?YutCore.legalMoves(g,curSteps()):[];}
function draw(){
  var h='<rect x="60" y="60" width="480" height="480" fill="none" stroke="#000" stroke-width="3"/>'+
   '<line x1="540" y1="60" x2="60" y2="540" stroke="#000" stroke-width="3"/><line x1="60" y1="60" x2="540" y2="540" stroke="#000" stroke-width="3"/>';
  var n,big={0:1,5:1,10:1,15:1,22:1};
  for(n=0;n<=28;n++)h+='<circle cx="'+C[n][0]+'" cy="'+C[n][1]+'" r="'+(big[n]?24:14)+'" fill="#fff" stroke="#000" stroke-width="'+(big[n]?4:2)+'"/>';
  h+='<text x="540" y="590" text-anchor="middle" font-size="16" font-weight="bold">Start / '+T.done+'</text>';
  var mv=human()&&!g.winner&&g.owed===0?movesFor():[],groups={};
  g.pieces.forEach(function(pc){var p=pos(pc);if(pc.done||p<0)return;(groups[p]=groups[p]||[]).push(pc);});
  Object.keys(groups).forEach(function(k){
    var gr=groups[k],x=C[k][0],y=C[k][1],mine=gr[0].player===0,can=mine&&mv.some(function(m){return m.from===+k;});
    h+='<g'+(can?' data-from="'+k+'"':'')+'>'+shape(gr[0].player,x,y,from===+k);
    if(gr.length>1)h+='<circle cx="'+(x+18)+'" cy="'+(y-18)+'" r="11" fill="#000"/><text x="'+(x+18)+'" y="'+(y-13)+'" text-anchor="middle" font-size="14" fill="#fff">'+gr.length+'</text>';
    if(can)h+='<circle cx="'+x+'" cy="'+y+'" r="26" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="5 4"/>';
    h+='</g>';
  });
  if(from!==null)mv.filter(function(m){return m.from===from;}).forEach(function(m,ix){
    var to=m.to==="finish"?0:m.to,x=C[to][0],y=C[to][1];
    h+='<g data-mv="'+mv.indexOf(m)+'"><circle cx="'+x+'" cy="'+y+'" r="30" fill="#fff" fill-opacity="0.01" stroke="#000" stroke-width="5"/>'+
     (m.choice?'<text x="'+x+'" y="'+(y-36)+'" text-anchor="middle" font-size="16" font-weight="bold">'+T[m.choice]+'</text>':'')+'</g>';
  });
  if(hintMv){var hx=C[hintMv.to==="finish"?0:hintMv.to];h+='<circle cx="'+hx[0]+'" cy="'+hx[1]+'" r="36" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="2 6"/>';
    if(hintMv.from>=0)h+='<circle cx="'+C[hintMv.from][0]+'" cy="'+C[hintMv.from][1]+'" r="36" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="2 6"/>';}
  $("b").innerHTML=h;
  var a="";
  if(!g.winner&&human()){
    if(g.owed>0)a+='<button data-a="throw">'+T.thr+'</button>';
    else{
      g.pending.forEach(function(s,ix){a+='<button data-t="'+ix+'" class="'+(ix===Math.min(sel,g.pending.length-1)?'on':'')+'">'+NAMES[s]+' ('+s+')</button>';});
      if(mv.some(function(m){return m.from===-1;}))a+='<button data-from="-1" class="'+(from===-1?'on':'')+'">'+T.wait+'</button>';
      a+='<button data-a="hint">'+T.hint+'</button>';
    }
  }
  $("acts").innerHTML=a;
  var s=g.winner!==null?f(T.win,{p:L[g.winner]}):f(g.owed>0?T.tt:T.tm,{p:L[g.turn]});
  $("status").textContent=s+" "+msg;
  $("info").innerHTML=T.players+": "+[0,1,2,3].slice(0,g.players).map(function(p){
    var mine=g.pieces.filter(function(x){return x.player===p;});
    return L[p]+" "+mine.filter(function(x){return !x.done&&!x.route.length;}).length+" "+T.wait2+", "+mine.filter(function(x){return x.done;}).length+" "+T.done;
  }).join(" | ");
}
function after(){g=YutCore.skipUnusable(g);sel=0;from=null;hintMv=null;draw();next();}
function doThrow(){
  var t=YutCore.throwSticks(Math.random);
  msg=f(T.thrown,{p:L[g.turn],n:NAMES[t.steps],s:t.steps});
  var before=g.pending.length;
  g=YutCore.addThrow(g,t);
  var lostCheck=YutCore.skipUnusable(g);
  if(lostCheck.pending.length<g.pending.length)msg+=" "+T.lost;
  after();
}
function doMove(m){
  var a=m.from,b=m.to;
  msg=f(T.moved,{p:L[g.turn],a:a<0?"–":a,b:b==="finish"?T.done:b})+(m.captures.length?T.cap:"");
  g=YutCore.applyMove(g,m);
  after();
}
function next(){
  if(g.winner!==null||human()||busy)return;
  busy=true;
  setTimeout(function(){
    busy=false;
    if(g.winner!==null||human())return;
    if(g.owed>0){doThrow();return;}
    var m=YutAI.chooseMove(g,Math.random,level);
    if(m)doMove(m);else after();
  },700);
}
$("b").addEventListener("click",function(e){
  var el=e.target.closest("[data-mv],[data-from]");
  if(!el||!human())return;
  var mv=movesFor();
  if(el.dataset.mv!==undefined){doMove(mv[+el.dataset.mv]);return;}
  from=+el.dataset.from;draw();
});
$("acts").addEventListener("click",function(e){
  var el=e.target.closest("button");
  if(!el)return;
  if(el.dataset.a==="throw"){doThrow();return;}
  if(el.dataset.a==="hint"){hintMv=YutAI.hint(g);if(hintMv){var ix=g.pending.indexOf(hintMv.steps);if(ix>=0)sel=ix;}draw();return;}
  if(el.dataset.t!==undefined){sel=+el.dataset.t;from=null;hintMv=null;draw();return;}
  if(el.dataset.from!==undefined){from=+el.dataset.from;draw();}
});
function start(){
  level=+$("lv").value;
  g=YutCore.createGame({players:+$("np").value,piecesPerPlayer:4});
  sel=0;from=null;hintMv=null;msg="";busy=false;
  draw();next();
}
$("new").textContent=T.nw;
$("new").addEventListener("click",start);
start();
})();
</script>
</body>
</html>
