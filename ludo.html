    <section id="offline-ai-controls" class="card">

    <button id="start-ludo-game" class="primary" data-i18n="ui_new_game">New game</button>

        <option value="6" data-i18n="ludo_board_6">6 players</option>
      </select>

        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>

      <label class="color-choice"><input type="radio" name="ludo-color" value="red" checked> <span class="color-choice-icon"><span class="ludo-icon-shape"><svg class="ludo-shape" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="44" fill="currentColor"/></svg></span></span></label>
      <label class="color-choice"><input type="radio" name="ludo-color" value="green"> <span class="color-choice-icon"><span class="ludo-icon-shape"><svg class="ludo-shape" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="37" fill="#fff" stroke="currentColor" stroke-width="16"/></svg></span></span></label>

      <label class="color-choice ludo-color-six hidden"><input type="radio" name="ludo-color" value="purple"> <span class="color-choice-icon"><span class="ludo-icon-shape"><svg class="ludo-shape" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><polygon points="50,2 98,50 50,98 2,50" fill="currentColor"/></svg></span></span></label>

<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>

    <span class="board-placeholder-icon ludo-icon-shape"><svg class="ludo-shape" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="44" fill="currentColor"/></svg></span>

    <div id="ludo-turn-indicator" class="ludo-turn-indicator" role="status" aria-live="polite"></div>
