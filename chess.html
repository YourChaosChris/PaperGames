<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eInkChess – Chess for E‑Ink</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="title-wrap app-title-row">
      <h1><a href="index.html" class="app-title-link">♞ eInkChess</a></h1>
      <a href="about.html" class="app-title-author app-title-author-link">by Christopher Müller</a>
    </div>
    <div class="user-panel">
      <button id="menu-toggle" class="secondary">&#9776; Menu</button>
    </div>
  </header>

  <main>

<div id="settings-panel">
  <div class="field-row user-status-row">
    <div id="user-status">Not connected</div>
    <div class="user-panel-buttons">
      <button id="login-button" class="primary">Connect (Lichess)</button>
      <button id="logout-button" class="secondary hidden">Logout</button>
    </div>
  </div>

<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary hidden">Offline</button>
      <button id="mode-offline-ai" class="mode-btn secondary">Offline</button>
      <button id="mode-online" class="mode-btn secondary">Online</button>
    </div>
  </div>
</section>

        <section id="online-controls" class="card hidden">
      <div class="field-row online-tabs-row">
        <div class="mode-buttons online-sub-tabs">
          <button id="online-tab-human" class="mode-btn secondary small active-mode">vs Human</button>
          <button id="online-tab-ai" class="mode-btn secondary small">vs Computer</button>
        </div>
        <button id="attach-button" class="secondary small">Load game</button>
      </div>
      <div id="online-human-row" class="field-row online-inline-row">
        <button id="start-seek-button" class="primary">Find game</button>
        <label class="checkbox-label">
          <input type="checkbox" id="rated-checkbox" checked>
          Rated
        </label>
        <select id="time-profile">
          <option value="10+0">10 + 0 (Rapid)</option>
          <option value="15+10" selected>15 + 10 (Rapid)</option>
          <option value="25+10">25 + 10 (Rapid)</option>
          <option value="30+20">30 + 20 (Classic)</option>
        </select>
      </div>
      <div id="online-ai-row" class="field-row online-inline-row hidden">
        <button id="start-ai-challenge-button" class="primary">Play Lichess AI</button>
        <div class="inline-options">
          <label class="color-choice"><input type="radio" name="ai-online-color" value="white" checked> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/></svg></span></label>
          <label class="color-choice"><input type="radio" name="ai-online-color" value="black"> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9a4 4 0 0 0-3.22 6.38 6.48 6.48 0 0 0-.87 10.65c-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47a6.46 6.46 0 0 0-.87-10.65A4.01 4.01 0 0 0 22.5 9z"/></svg></span></label>
          <label class="color-choice"><input type="radio" name="ai-online-color" value="random"> Random</label>
        </div>
        <select id="ai-online-level">
          <option value="1">Level 1 – ~800 Elo</option>
          <option value="2">Level 2 – ~1100 Elo</option>
          <option value="3" selected>Level 3 – ~1400 Elo</option>
          <option value="4">Level 4 – ~1700 Elo</option>
          <option value="5">Level 5 – ~2000 Elo</option>
          <option value="6">Level 6 – ~2300 Elo</option>
          <option value="7">Level 7 – ~2700 Elo</option>
          <option value="8">Level 8 – ~3200 Elo</option>
        </select>
      </div>
      <div id="online-status" class="status-text"></div>
    </section>

    <section id="offline-ai-controls" class="card hidden">
  <div class="field-row">
    <button id="start-ai-game" class="primary">New game</button>
    <div id="ai-color-choice" class="inline-options">
      <label class="color-choice"><input type="radio" name="ai-color" value="white" checked> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/></svg></span></label>
      <label class="color-choice"><input type="radio" name="ai-color" value="black"> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9a4 4 0 0 0-3.22 6.38 6.48 6.48 0 0 0-.87 10.65c-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47a6.46 6.46 0 0 0-.87-10.65A4.01 4.01 0 0 0 22.5 9z"/></svg></span></label>
    </div>
    <select id="ai-level-inline">
        <option value="0">2 Player</option>
        <option value="1">Level 1 – ~600 Elo (~1s/move)</option>
        <option value="2">Level 2 – ~900 Elo (~2s/move)</option>
        <option value="3">Level 3 – ~1200 Elo (~4s/move)</option>
        <option value="4">Level 4 – ~1400 Elo (~4–6s/move)</option>
        <option value="5">Level 5 – ~1600 Elo (~6–10s/move)</option>
      </select>
  </div>
  <div id="offline-ai-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-clocks" class="status-text game-clocks"></div>
    <div id="game-result"></div>

    <div id="board-info" class="status-text"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon">♞</span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title">eInkChess</span>
      <span class="board-placeholder-subtitle">by Christopher Müller</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="board"></div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="undo-btn" class="secondary small hidden" onclick="undoLastMove()">Undo</button>
    <button id="offer-draw-button" class="secondary small hidden">Offer draw</button>
    <button id="resign-button" class="secondary small hidden">Resign 🏳</button>
  </div>
  <div id="score-line" class="score-line hidden"><span id="score-captures" class="score-line-captures"></span><span id="score-diff" class="score-line-diff"></span></div>
  <pre id="moves-list" class="moves-list hidden"></pre>
</section>
  </main>
</div>

<script src="chess-core.js"></script>
<script src="pieces.js"></script>
<script src="ai-engine.js"></script>
<script src="lichess-auth.js"></script>
<script src="lichess-api.js"></script>
<script src="app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
