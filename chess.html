  <main>

<div id="settings-panel">
  <div class="field-row user-status-row">
    <div id="user-status" data-i18n="not_connected">Not connected</div>
    <div class="user-panel-buttons">
      <button id="login-button" class="primary" data-i18n="connect_lichess">Connect (Lichess)</button>
      <button id="logout-button" class="secondary hidden" data-i18n="logout">Logout</button>
    </div>
  </div>

<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary hidden" data-i18n="chess_mode_offline">Offline</button>
      <button id="mode-offline-ai" class="mode-btn secondary" data-i18n="chess_mode_offline">Offline</button>
      <button id="mode-online" class="mode-btn secondary" data-i18n="chess_mode_online">Online</button>
    </div>
  </div>
</section>

        <section id="online-controls" class="card hidden">
      <div class="field-row online-tabs-row">
        <div class="mode-buttons online-sub-tabs">
          <button id="online-tab-human" class="mode-btn secondary small active-mode" data-i18n="vs_human">vs Human</button>
          <button id="online-tab-ai" class="mode-btn secondary small" data-i18n="vs_computer">vs Computer</button>
        </div>
        <button id="attach-button" class="secondary small" data-i18n="load_game">Load game</button>
      </div>
      <div id="online-human-row" class="field-row online-inline-row">
        <button id="start-seek-button" class="primary" data-i18n="find_game">Find game</button>
        <label class="checkbox-label">
          <input type="checkbox" id="rated-checkbox" checked>
          <span data-i18n="chess_rated_checkbox">Rated</span>
        </label>
        <select id="time-profile">
          <option value="10+0" data-i18n="chess_time_10_0">10 + 0 (Rapid)</option>
          <option value="15+10" selected data-i18n="chess_time_15_10">15 + 10 (Rapid)</option>
          <option value="25+10" data-i18n="chess_time_25_10">25 + 10 (Rapid)</option>
          <option value="30+20" data-i18n="chess_time_30_20">30 + 20 (Classic)</option>
        </select>
      </div>
      <div id="online-ai-row" class="field-row online-inline-row hidden">
        <button id="start-ai-challenge-button" class="primary" data-i18n="chess_play_lichess_ai">Play Lichess AI</button>
        <div class="inline-options">
          <label class="color-choice"><input type="radio" name="ai-online-color" value="white" checked> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/></svg></span></label>
          <label class="color-choice"><input type="radio" name="ai-online-color" value="black"> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9a4 4 0 0 0-3.22 6.38 6.48 6.48 0 0 0-.87 10.65c-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47a6.46 6.46 0 0 0-.87-10.65A4.01 4.01 0 0 0 22.5 9z"/></svg></span></label>
          <label class="color-choice"><input type="radio" name="ai-online-color" value="random"> <span data-i18n="chess_color_random">Random</span></label>
        </div>
        <select id="ai-online-level">
          <option value="1" data-i18n="chess_online_level_1">Level 1 – ~800 Elo</option>
          <option value="2" data-i18n="chess_online_level_2">Level 2 – ~1100 Elo</option>
          <option value="3" selected data-i18n="chess_online_level_3">Level 3 – ~1400 Elo</option>
          <option value="4" data-i18n="chess_online_level_4">Level 4 – ~1700 Elo</option>
          <option value="5" data-i18n="chess_online_level_5">Level 5 – ~2000 Elo</option>
          <option value="6" data-i18n="chess_online_level_6">Level 6 – ~2300 Elo</option>
          <option value="7" data-i18n="chess_online_level_7">Level 7 – ~2700 Elo</option>
          <option value="8" data-i18n="chess_online_level_8">Level 8 – ~3200 Elo</option>
        </select>
      </div>
      <div id="online-status" class="status-text"></div>
    </section>

    <section id="offline-ai-controls" class="card hidden">
  <div class="field-row">
    <button id="start-ai-game" class="primary" data-i18n="new_game">New game</button>
    <div id="ai-color-choice" class="inline-options">
      <label class="color-choice"><input type="radio" name="ai-color" value="white" checked> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path fill="#fff" stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/></svg></span></label>
      <label class="color-choice"><input type="radio" name="ai-color" value="black"> <span class="color-choice-icon"><svg class="piece-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path stroke="#000" stroke-linecap="round" stroke-width="1.5" d="M22.5 9a4 4 0 0 0-3.22 6.38 6.48 6.48 0 0 0-.87 10.65c-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47a6.46 6.46 0 0 0-.87-10.65A4.01 4.01 0 0 0 22.5 9z"/></svg></span></label>
    </div>
    <select id="ai-level-inline">
        <option value="0" data-i18n="mode_two_player">2 Player (local)</option>
        <option value="1" data-i18n="chess_level_inline_1">Level 1 – ~800 Elo (instant)</option>
        <option value="2" data-i18n="chess_level_inline_2">Level 2 – ~1100 Elo (~1s/move)</option>
        <option value="3" data-i18n="chess_level_inline_3">Level 3 – ~1400 Elo (~2–4s/move)</option>
        <option value="4" data-i18n="chess_level_inline_4">Level 4 – ~1700 Elo (~5–10s/move)</option>
        <option value="5" data-i18n="chess_level_inline_5">Level 5 – ~2000 Elo (~10–20s/move)</option>
      </select>
  </div>
  <div id="offline-ai-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-clocks" class="status-text game-clocks"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path fill="#000" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path fill="#000" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-2 2.5-3c1 0 1 3 1 3"/><path fill="#ececec" stroke="#ececec" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.43-9.75a.5 1.5 30 1 1-.86-.5.5 1.5 30 1 1 .86.5"/><path fill="#ececec" stroke="none" d="m24.55 10.4-.45 1.45.5.15c3.15 1 5.65 2.49 7.9 6.75S35.75 29.06 35.25 39l-.05.5h2.25l.05-.5c.5-10.06-.88-16.85-3.25-21.34s-5.79-6.64-9.19-7.16z"/></g></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_chess">Chess</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="board" role="group" aria-label="Chess board"></div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="undo-btn" class="secondary small hidden" data-i18n="undo_button" onclick="undoLastMove()">Undo</button>
    <button id="toggle-moves" class="secondary small" type="button" data-i18n="toggle_moves_button">Moves</button>
    <button id="offer-draw-button" class="secondary small hidden" data-i18n="offer_draw_button">Offer draw</button>
    <button id="resign-button" class="secondary small hidden" data-i18n="resign_button">Resign 🏳</button>
  </div>
  <div id="score-line" class="score-line hidden"><span id="score-captures" class="score-line-captures"></span><span id="score-diff" class="score-line-diff"></span></div>
  <pre id="moves-list" class="moves-list hidden"></pre>
</section>
