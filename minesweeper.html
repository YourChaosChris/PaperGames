<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eInkChess – Minesweeper for E‑Ink</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="title-wrap app-title-row">
      <h1><a href="index.html" class="app-title-link">♞ eInkChess</a></h1>
      <a href="about.html" class="app-title-author app-title-author-link">by Christopher Müller</a>
    </div>
    <div class="user-panel">
      <button id="menu-toggle" class="secondary">&#9776; Menu</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html" class="site-nav-link" data-i18n="nav_home">Home</a>
    <a href="guide.html" class="site-nav-link" data-i18n="nav_guide">Guide</a>
    <a href="about.html" class="site-nav-link" data-i18n="nav_about">About</a>
  </nav>

  <main>

<div id="settings-panel">
    <section id="minesweeper-controls" class="card">
  <div class="field-row">
    <button id="start-minesweeper-game" class="primary" data-i18n="minesweeper_new_game">New game</button>
    <select id="minesweeper-level-inline">
        <option value="beginner" data-i18n="level_easy">Easy (9x9, 10 mines)</option>
        <option value="intermediate" selected data-i18n="level_medium">Medium (16x16, 40 mines)</option>
        <option value="expert" data-i18n="level_hard">Hard (30x16, 99 mines)</option>
      </select>
  </div>
  <div id="offline-minesweeper-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon mine-icon" aria-hidden="true"></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_minesweeper">Minesweeper</span>
      <span class="board-placeholder-subtitle">eInkChess</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="minesweeper-toolbar" class="minesweeper-toolbar">
      <button id="minesweeper-flag-toggle" type="button" class="secondary small" data-i18n="minesweeper_flag_mode">Flag mode</button>
      <span id="minesweeper-mine-counter" class="minesweeper-mine-counter"></span>
      <span id="minesweeper-timer" class="minesweeper-timer"></span>
    </div>
    <div id="minesweeper-board-wrap" class="minesweeper-board-wrap">
      <div id="minesweeper-board" class="minesweeper-board" role="group" aria-label="Minesweeper board"></div>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
  </div>
</section>
  </main>
</div>

<script src="i18n.js"></script>
<script src="minesweeper-core.js"></script>
<script src="result-modal.js"></script>
<script src="game-storage.js"></script>
<script src="game-stats.js"></script>
<script src="board-a11y.js"></script>
<script src="minesweeper-app.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
