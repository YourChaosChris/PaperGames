<div id="settings-panel" class="hidden">
<section id="adv-controls" class="card">
  <div class="field-row">
    <label class="adv-check"><input type="checkbox" id="adv-all-open"> <span data-i18n="adv_all_open">Open all doors (to try it out)</span></label>
  </div>
</section>

<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder hidden">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="4" width="32" height="32" fill="#fff" stroke="#141413" stroke-width="2.6"/><path d="M4 15H36M4 26H36M15 4V36M26 4V36" stroke="#141413" stroke-width="1.6"/><rect x="15" y="15" width="11" height="11" fill="#141413"/></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_advent">Puzzle Advent Calendar</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container">
    <div id="adv-calendar">
      <p class="adv-legend status-text"><span class="adv-legend-pic adv-pic-closed" aria-hidden="true"></span> <span data-i18n="adv_legend_closed">closed</span> · <span class="adv-legend-pic adv-pic-open" aria-hidden="true"></span> <span data-i18n="adv_legend_open">open</span> · <span class="adv-legend-pic adv-pic-solved" aria-hidden="true">&#10003;</span> <span data-i18n="adv_legend_solved">solved</span></p>
      <div id="adv-doors" class="adv-doors" role="group" data-i18n-attr="aria-label:adv_doors_aria" aria-label="24 doors"></div>
      <div class="adv-door-actions">
        <button id="adv-new-game" class="primary" type="button" data-i18n="adv_open_next">Open the next door</button>
      </div>
    </div>
    <div id="adv-door" class="adv-door hidden">
      <h2 id="adv-door-title" class="adv-door-title"></h2>
      <p id="adv-door-how" class="adv-door-how status-text"></p>
      <div id="adv-puzzle" class="adv-puzzle"></div>
      <div id="adv-pad" class="adv-pad" role="group" data-i18n-attr="aria-label:adv_pad_aria" aria-label="Numbers"></div>
      <p id="adv-door-note" class="adv-door-note status-text" aria-live="polite"></p>
      <div id="adv-solved" class="adv-solved hidden" role="status">
        <p class="adv-solved-title" data-i18n="adv_solved_title">Solved!</p>
        <p id="adv-solved-text" class="adv-solved-text"></p>
      </div>
      <div class="adv-door-actions">
        <button id="adv-back" class="primary" type="button" data-i18n="adv_back">Back to the calendar</button>
        <button id="adv-reset" class="secondary" type="button" data-i18n="adv_reset">Start this door again</button>
      </div>
    </div>
  </div>
</section>
