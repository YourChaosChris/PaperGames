<div id="settings-panel">
    <section id="mastermind-controls" class="card">
  <div class="field-row">
    <button id="start-mastermind-game" class="primary" data-i18n="mastermind_new_game">New game</button>
    <select id="mastermind-level-inline">
        <option value="easy" data-i18n="level_easy">Easy</option>
        <option value="medium" selected data-i18n="level_medium">Medium</option>
        <option value="hard" data-i18n="level_hard">Hard</option>
      </select>
  </div>
  <div id="offline-mastermind-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="12" fill="#ffffff" stroke="#141413" stroke-width="6"/><circle cx="20" cy="50" r="10" fill="#141413"/><rect x="31" y="41" width="18" height="18" fill="#141413"/><polygon points="60,38 70,60 50,60" fill="#141413"/><polygon points="80,38 92,50 80,62 68,50" fill="#141413"/></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_mastermind">Mastermind</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="mastermind-guess-row" class="mastermind-guess-row" role="group" aria-label="Current guess"></div>
    <div id="board-actions" class="board-actions">
      <button id="mastermind-submit-btn" type="button" class="primary" data-i18n="mastermind_submit_guess">Submit guess</button>
    </div>
    <div class="mastermind-legend">
      <div class="mastermind-legend-row"><span class="mastermind-peg mastermind-peg-black"></span> <span data-i18n="mastermind_legend_black">Right shape, right position</span></div>
      <div class="mastermind-legend-row"><span class="mastermind-peg mastermind-peg-white"></span> <span data-i18n="mastermind_legend_white">Right shape, wrong position</span></div>
    </div>
    <div id="mastermind-history" class="mastermind-history" aria-label="Guess history"></div>
  </div>
</section>
