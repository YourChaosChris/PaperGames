<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">

    </div>

</section>

    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-romme-game" class="primary" data-i18n="new_game">New game</button>
    <span id="romme-ai-wrap">
      <label><span data-i18n="romme_opponents_label">Computer opponents:</span>
        <select id="romme-opponents-inline">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select></label>
      <select id="romme-level-inline">
        <option value="1" data-i18n="level_easy">Easy</option>
        <option value="2" selected data-i18n="level_medium">Medium</option>
        <option value="3" data-i18n="level_hard">Hard</option>
      </select>
    </span>
    <span id="romme-seats-wrap" class="hidden">
      <label><span data-i18n="romme_seats_label">Players:</span>
        <select id="romme-seats-inline">
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select></label>
    </span>
    <label><span data-i18n="romme_threshold_label">First meld at least:</span>
      <select id="romme-threshold-inline">
        <option value="30" data-i18n="romme_points_30">30 points</option>
        <option value="40" selected data-i18n="romme_points_40">40 points</option>
        <option value="51" data-i18n="romme_points_51">51 points</option>
      </select></label>
  </div>
  <div id="offline-romme-status" class="status-text"></div>
</section>

<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="8" y="14" width="40" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="3"/><rect x="30" y="20" width="40" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="3"/><rect x="52" y="26" width="40" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="3"/><text x="72" y="62" text-anchor="middle" font-size="24" font-weight="700" font-family="sans-serif" fill="#111">7</text></svg></span>

      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="romme-players" class="game-players" role="status" aria-live="polite"></div>
    <div id="romme-round-line" class="status-text"></div>
    <div class="pc-row">
      <span class="pc-row-label" data-i18n="romme_label_table">Table</span>
      <div id="romme-table" class="concan-melds romme-table"></div>
    </div>
    <div class="concan-piles">
      <button id="romme-stock" class="pc-card pc-card-back concan-stock" type="button"></button>
      <button id="romme-discard" class="pc-card romme-discard" type="button"></button>
    </div>
    <div id="romme-staged" class="pc-row hidden">
      <span id="romme-staged-label" class="pc-row-label"></span>
      <div id="romme-staged-melds" class="concan-melds"></div>
    </div>

      <p id="romme-hand-cover-text"></p>
      <button id="romme-show-hand" class="primary" type="button" data-i18n="maumau_show_hand">Show my cards</button>
    </div>
    <div id="romme-mine">
      <span id="romme-my-label" class="pc-row-label"></span>
      <div id="romme-hand" class="pc-row romme-hand" role="group" data-i18n-attr="aria-label:schwimmen_hand_label" aria-label="Your cards"></div>
      <div id="romme-actions" class="game-actions-row hidden">
        <button id="romme-meld-button" class="secondary" type="button" data-i18n="romme_meld_button">Lay out</button>
        <button id="romme-confirm-button" class="secondary hidden" type="button" data-i18n="romme_confirm_button">Lay out first meld</button>
        <button id="romme-cancel-button" class="secondary hidden" type="button" data-i18n="romme_cancel_button">Take back</button>
        <button id="romme-discard-button" class="secondary" type="button" data-i18n="romme_discard_button">Discard</button>
      </div>
    </div>
    <div id="romme-round-end" class="romme-round-end hidden">
      <h2 data-i18n="romme_round_end_title">End of the round</h2>
      <ul id="romme-round-scores"></ul>
      <button id="romme-next-round" class="primary" type="button" data-i18n="romme_next_round">Next round</button>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
