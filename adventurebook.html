  <main>

<div id="settings-panel">
    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-adventurebook-game" class="primary" data-i18n="ab_new_hero">New hero</button>
  </div>
</section>
</div>
<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-result" aria-live="assertive"></div>
    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder hidden">
    <span class="board-placeholder-icon" aria-hidden="true"><svg viewBox="0 0 40 40" width="40" height="40"><path d="M6 8H19V34H6Z" fill="#fff" stroke="#141413" stroke-width="2"/><path d="M21 8H34V34H21Z" fill="#fff" stroke="#141413" stroke-width="2"/><path d="M19 8Q20 6 21 8V34Q20 36 19 34Z" fill="#141413"/><path d="M27 13L28.5 17H32.5L29.3 19.5L30.5 23.5L27 21L23.5 23.5L24.7 19.5L21.5 17H25.5Z" fill="#141413"/><path d="M9 14H16M9 19H16M9 24H14" stroke="#141413" stroke-width="2"/></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_adventurebook">Adventure Book</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container">
    <div id="ab-create" class="ab-create">
      <h2 class="ab-heading" data-i18n="ab_create_title">Your hero</h2>
      <div class="field-row ab-name-row">
        <label for="ab-name" data-i18n="ab_name_label">Name:</label>
        <input id="ab-name" type="text" maxlength="20" autocomplete="off">
      </div>
      <fieldset class="ab-fieldset">
        <legend data-i18n="ab_class_label">Class:</legend>
        <div id="ab-classes" class="ab-classes"></div>
      </fieldset>
      <p id="ab-points" class="ab-points" aria-live="polite"></p>
      <div id="ab-stats" class="ab-stats"></div>
      <div class="field-row">
        <label for="ab-level" data-i18n="ab_level_label">Difficulty:</label>
        <select id="ab-level">
          <option value="easy" data-i18n="level_easy">Easy</option>
          <option value="medium" selected data-i18n="level_medium">Medium</option>
          <option value="hard" data-i18n="level_hard">Hard</option>
        </select>
      </div>
      <div class="field-row">
        <label for="ab-setting" data-i18n="ab_setting_label">Place:</label>
        <select id="ab-setting">
          <option value="random" selected data-i18n="ab_setting_random">Random</option>
          <option value="cave" data-i18n="ab_setting_cave">Crystal Cave</option>
          <option value="tower" data-i18n="ab_setting_tower">Raven Tower</option>
          <option value="forest" data-i18n="ab_setting_forest">Misty Forest</option>
        </select>
      </div>
      <p id="ab-create-msg" class="ab-create-msg" aria-live="polite"></p>
      <div class="ab-actions"><button type="button" id="ab-start" class="primary" data-i18n="ab_start">Start the adventure</button></div>
    </div>
    <div id="ab-play" class="ab-play hidden">
      <p id="ab-goal" class="ab-goal"></p>
      <h2 id="ab-room-title" class="ab-heading"></h2>
      <p id="ab-room-text" class="ab-room-text"></p>
      <p id="ab-event" class="ab-event"></p>
      <div id="ab-fight" class="ab-fight hidden"></div>
      <div id="ab-result" class="ab-result" aria-live="polite"></div>
      <div id="ab-choices" class="ab-choices" role="group"></div>
      <div id="ab-end" class="ab-actions hidden">
        <button type="button" id="ab-same" class="primary" data-i18n="ab_same_hero">Same hero, new adventure</button>
        <button type="button" id="ab-new" class="secondary" data-i18n="ab_new_hero">New hero</button>
      </div>
      <div class="ab-actions">
        <button type="button" id="ab-map-btn" class="secondary" aria-controls="ab-map" aria-expanded="false">Map</button>
        <button type="button" id="ab-pack-btn" class="secondary" aria-controls="ab-pack" aria-expanded="false">Backpack</button>
      </div>
      <div id="ab-map" class="ab-panel hidden"></div>
      <div id="ab-pack" class="ab-panel hidden"></div>
      <p id="ab-hero" class="ab-hero"></p>
      <h2 class="ab-heading" data-i18n="ab_log_title">Last steps</h2>
      <ol id="ab-log" class="ab-log"></ol>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="resign-button" class="secondary small hidden" data-i18n="resign_button">Resign 🏳</button>
  </div>
</section>
