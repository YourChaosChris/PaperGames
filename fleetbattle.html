  <main>

<div id="settings-panel">
    <section id="fleetbattle-controls" class="card">
  <div class="field-row">
    <button id="start-fleetbattle-game" class="primary" data-i18n="new_game">New game</button>
    <select id="fleetbattle-level-inline">
        <option value="easy" data-i18n="level_easy">Easy</option>
        <option value="medium" selected data-i18n="level_medium">Medium</option>
        <option value="hard" data-i18n="level_hard">Hard</option>
      </select>
  </div>
  <div id="offline-fleetbattle-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="12" fill="#ffffff" stroke="#141413" stroke-width="6"/><g fill="#141413"><polygon points="10,66 22,53 78,53 90,66 76,82 24,82"/><rect x="38" y="34" width="9" height="22"/><rect x="57" y="28" width="9" height="28"/></g></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_fleetbattle">Fleet Battle</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">

    <div id="fb-placement-controls" class="board-actions hidden">
      <button id="fb-rotate-btn" type="button" class="secondary small" data-i18n="fleetbattle_rotate_button">Rotate</button>
      <button id="fb-random-btn" type="button" class="secondary small" data-i18n="fleetbattle_random_button">Random placement</button>
      <button id="fb-reset-btn" type="button" class="secondary small" data-i18n="fleetbattle_reset_button">Reset placement</button>
      <button id="fb-start-battle-btn" type="button" class="primary" disabled data-i18n="fleetbattle_start_battle_button">Start battle</button>
    </div>

    <div id="fb-boards" class="fb-boards">
      <div class="fb-board-block">
        <h2 data-i18n="fleetbattle_your_fleet">Your Fleet</h2>
        <div class="fb-grid-wrap">
          <div id="fb-own-grid" class="fb-grid" role="group" data-i18n-attr="aria-label:fleetbattle_your_fleet"></div>
        </div>
      </div>
      <div class="fb-board-block hidden" id="fb-enemy-block">
        <h2 data-i18n="fleetbattle_enemy_waters">Enemy Waters</h2>
        <div class="fb-grid-wrap">
          <div id="fb-enemy-grid" class="fb-grid" role="group" data-i18n-attr="aria-label:fleetbattle_enemy_waters"></div>
        </div>
      </div>
    </div>

    <div class="fb-legend">
      <div class="fb-legend-row"><span class="fb-legend-mark fb-ship" aria-hidden="true"></span> <span data-i18n="fleetbattle_legend_ship">Your ship</span></div>
      <div class="fb-legend-row"><span class="fb-legend-mark fb-hit" aria-hidden="true"></span> <span data-i18n="fleetbattle_legend_hit">Hit</span></div>
      <div class="fb-legend-row"><span class="fb-legend-mark fb-miss" aria-hidden="true"></span> <span data-i18n="fleetbattle_legend_miss">Miss</span></div>
      <div class="fb-legend-row"><span class="fb-legend-mark fb-sunk" aria-hidden="true"></span> <span data-i18n="fleetbattle_legend_sunk">Sunk ship</span></div>
    </div>

  </div>
  <div id="board-actions" class="board-actions">
    <button id="fb-resign-btn" class="secondary small hidden" data-i18n="fleetbattle_resign_button">Resign</button>
  </div>
</section>
