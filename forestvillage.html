<section class="mode-section">

    <section id="offline-ai-controls" class="card">

    <button id="start-forestvillage-game" class="primary" data-i18n="ui_new_game">New game</button>

    <label for="fv-level" data-i18n="fv_level_label">Computer:</label>
    <select id="fv-level">
        <option value="easy" data-i18n="level_easy">Easy</option>
        <option value="medium" selected data-i18n="level_medium">Medium</option>
        <option value="hard" data-i18n="level_hard">Hard</option>

<section id="board-section" class="card">

    <p id="fv-me" class="fv-me"></p>
    <p id="fv-solo" class="fv-solo"></p>

    <div id="fv-fields" class="fv-fields" role="group"></div>
    <h2 class="fv-heading" data-i18n="fv_clearing_title">Clearing (6 open cards)</h2>
    <ul id="fv-clearing" class="fv-cards" role="group"></ul>

      <p id="fv-hand-cover-text"></p>

    <p id="fv-info" class="fv-info" aria-live="polite"></p>
    <div class="fv-actions">
      <button type="button" id="fv-build" class="primary" data-i18n="fv_build">Build</button>
      <button type="button" id="fv-end" class="secondary" data-i18n="fv_end_turn">End turn</button>
    </div>
    <h2 class="fv-heading" id="fv-village-title"></h2>
    <ul id="fv-village" class="fv-cards fv-village"></ul>
    <h2 class="fv-heading" data-i18n="fv_task_title">Task card</h2>
