<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary" data-i18n="maumau_mode_hotseat">Same device</button>
      <button id="mode-offline-ai" class="mode-btn secondary active-mode" data-i18n="vs_computer">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-concan-game" class="primary" data-i18n="new_game">New game</button>
    <span id="concan-level-wrap">
      <select id="concan-level-inline">
        <option value="1" data-i18n="level_easy">Easy</option>
        <option value="2" selected data-i18n="level_medium">Medium</option>
        <option value="3" data-i18n="level_hard">Hard</option>
      </select>
    </span>
  </div>
  <div id="offline-concan-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="14" y="8" width="56" height="78" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><rect x="32" y="16" width="56" height="78" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><text x="60" y="50" text-anchor="middle" font-size="18" font-weight="700" font-family="sans-serif" fill="#141413">7</text><text x="60" y="68" text-anchor="middle" font-size="18" font-weight="700" font-family="sans-serif" fill="#141413">J</text><text x="60" y="86" text-anchor="middle" font-size="18" font-weight="700" font-family="sans-serif" fill="#141413">Q</text></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_concan">Concan</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="concan-players" class="game-players" role="status" aria-live="polite"></div>
    <div class="pc-row">
      <span id="concan-other-label" class="pc-row-label"></span>
      <div id="concan-other-melds" class="concan-melds"></div>
    </div>
    <div class="concan-piles">
      <button id="concan-stock" class="pc-card pc-card-back concan-stock" type="button"></button>
      <button id="concan-discard" class="pc-card concan-discard" type="button"></button>
    </div>
    <div id="concan-taken" class="pc-row hidden"></div>
    <div id="concan-hand-cover" class="hand-cover hidden">
      <p id="concan-hand-cover-text"></p>
      <button id="concan-show-hand" class="primary" type="button" data-i18n="maumau_show_hand">Show my cards</button>
    </div>
    <div id="concan-mine">
      <div class="pc-row">
        <span id="concan-my-label" class="pc-row-label"></span>
        <div id="concan-my-melds" class="concan-melds"></div>
      </div>
      <div id="concan-hand" class="pc-row" role="group" data-i18n-attr="aria-label:schwimmen_hand_label" aria-label="Your cards"></div>
      <div id="concan-actions" class="game-actions-row hidden">
        <button id="concan-meld-button" class="secondary" type="button" data-i18n="concan_meld_button">Lay out</button>
        <button id="concan-discard-button" class="secondary" type="button" data-i18n="concan_discard_button">Discard</button>
      </div>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="resign-button" class="secondary small hidden" data-i18n="resign_button">Resign 🏳</button>
  </div>
