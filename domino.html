<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary" data-i18n="domino_mode_hotseat">Same device</button>
      <button id="mode-offline-ai" class="mode-btn secondary active-mode" data-i18n="vs_computer">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-domino-game" class="primary" data-i18n="new_game">New game</button>
    <label for="domino-num-players" data-i18n="domino_num_players">Players:</label>
    <select id="domino-num-players">
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    <span id="domino-level-wrap">
      <select id="domino-level-inline">
        <option value="1" data-i18n="level_easy">Easy</option>
        <option value="2" selected data-i18n="level_medium">Medium</option>
        <option value="3" data-i18n="level_hard">Hard</option>
      </select>
    </span>
  </div>
  <div id="offline-domino-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon"><svg class="domino-icon" viewBox="0 0 100 50" aria-hidden="true" focusable="false"><rect x="1.5" y="1.5" width="97" height="47" rx="6" fill="#fff" stroke="currentColor" stroke-width="3"/><line x1="50" y1="6" x2="50" y2="44" stroke="currentColor" stroke-width="2.5"/><circle cx="13" cy="13" r="5" fill="currentColor"/><circle cx="37" cy="13" r="5" fill="currentColor"/><circle cx="25" cy="25" r="5" fill="currentColor"/><circle cx="13" cy="37" r="5" fill="currentColor"/><circle cx="37" cy="37" r="5" fill="currentColor"/><circle cx="63" cy="13" r="5" fill="currentColor"/><circle cx="75" cy="25" r="5" fill="currentColor"/><circle cx="87" cy="37" r="5" fill="currentColor"/></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_domino">Domino</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="domino-players" class="game-players" role="status" aria-live="polite"></div>
    <div id="domino-board" class="domino-board">
      <div class="domino-ends">
        <button id="domino-end-left" class="domino-end" type="button" disabled></button>
        <span class="domino-ends-label" data-i18n="domino_open_ends">Open ends</span>
        <button id="domino-end-right" class="domino-end" type="button" disabled></button>
      </div>
      <div id="domino-line" class="domino-line" aria-label="Line of tiles"></div>
    </div>
    <div id="domino-hand-cover" class="hand-cover hidden">
      <p id="domino-hand-cover-text"></p>
      <button id="domino-show-hand" class="primary" type="button" data-i18n="domino_show_hand">Show my tiles</button>
    </div>
    <div id="domino-hand" class="domino-hand" role="group" aria-label="Your tiles"></div>
    <div class="game-actions-row">
      <button id="domino-stock-button" class="secondary" type="button" data-i18n="domino_draw_button">Draw from stock</button>
      <button id="domino-pass-button" class="secondary" type="button" data-i18n="domino_pass_button">Pass</button>
    </div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="resign-button" class="secondary small hidden" data-i18n="resign_button">Resign 🏳</button>
  </div>
</section>
