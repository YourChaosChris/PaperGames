  <main>

<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary" data-i18n="mode_two_player">2 Player (local)</button>
      <button id="mode-offline-ai" class="mode-btn secondary" data-i18n="vs_computer">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card hidden">
  <div class="field-row">
    <button id="start-morris-game" class="primary" data-i18n="new_game">New game</button>
    <div id="morris-color-choice" class="inline-options">
      <label class="color-choice"><input type="radio" name="morris-color" value="black" checked> <span class="color-choice-icon"><span class="morris-icon-disc morris-icon-disc-black"></span></span></label>
      <label class="color-choice"><input type="radio" name="morris-color" value="white"> <span class="color-choice-icon"><span class="morris-icon-disc morris-icon-disc-white"></span></span></label>
    </div>
    <select id="morris-level-inline">
        <option value="0" data-i18n="mode_two_player">2 Player (local)</option>
        <option value="1" data-i18n="level_easy">Easy</option>
        <option value="2" selected data-i18n="level_medium">Medium</option>
        <option value="3" data-i18n="level_hard">Hard</option>
      </select>
  </div>
  <div id="offline-morris-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon"><span class="morris-icon-disc morris-icon-disc-black"></span></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_morris">Morris</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div id="morris-board" class="morris-board" role="group" aria-label="Nine Men's Morris board"></div>
  </div>
  <div id="board-actions" class="board-actions">
    <button id="undo-btn" class="secondary small hidden" onclick="undoLastMove()">Undo</button>
    <button id="toggle-moves" class="secondary small" type="button" data-i18n="toggle_moves_button">Moves</button>
    <button id="resign-button" class="secondary small hidden">Resign 🏳</button>
  </div>
  <pre id="moves-list" class="moves-list hidden"></pre>
</section>
