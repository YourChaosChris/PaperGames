  <main>

<div id="settings-panel">
<section class="mode-section">
  <div class="mode-section-row">
    <div class="mode-buttons">
      <button id="mode-offline" class="mode-btn secondary" data-i18n="maumau_mode_hotseat">Same device</button>
      <button id="mode-offline-ai" class="mode-btn secondary active-mode" data-i18n="vs_computer">vs Computer</button>
    </div>
  </div>
</section>

    <section id="offline-ai-controls" class="card">
  <div class="field-row">
    <button id="start-trix-game" class="primary" data-i18n="new_game">New game</button>
    <span id="tx-humans-wrap" class="hidden">
      <label for="tx-humans" data-i18n="dk_humans_label">People on this device:</label>
      <select id="tx-humans">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
      </select>
    </span>
    <select id="tx-level-inline">
      <option value="1" data-i18n="level_easy">Easy</option>
      <option value="2" selected data-i18n="level_medium">Medium</option>
      <option value="3" data-i18n="level_hard">Hard</option>
    </select>
  </div>
  <div id="offline-trix-status" class="status-text"></div>
</section>
</div>


<section id="board-section" class="card">
  <div class="board-header">
    <div id="game-label"></div>
    <div id="game-meta"></div>
    <div id="game-result" aria-live="assertive"></div>

    <div id="board-info" class="status-text" aria-live="polite"></div>
  </div>
  <div id="board-placeholder" class="board-placeholder">
    <span class="board-placeholder-icon board-placeholder-icon-svg" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="10" y="12" width="50" height="72" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><rect x="40" y="16" width="50" height="72" rx="7" fill="#ffffff" stroke="#141413" stroke-width="5"/><text x="65" y="50" text-anchor="middle" font-size="24" font-weight="700" font-family="sans-serif" fill="#141413">K</text><path d="M65 56 C65 56 54 64 54 70 C54 74 57 76 60 76 C62 76 64 75 65 73 C66 75 68 76 70 76 C73 76 76 74 76 70 C76 64 65 56 65 56 Z" fill="#fff" stroke="#141413" stroke-width="3"/></svg></span>
    <div class="board-placeholder-text">
      <span class="board-placeholder-title" data-i18n="game_trix">Trix</span>
      <span class="board-placeholder-subtitle">PaperGames</span>
    </div>
  </div>
  <div id="board-container" class="hidden">
    <div class="tx-top">
      <div id="tx-contract" class="tx-contract"></div>
      <div id="tx-kingdom" class="tx-kingdom"></div>
      <div id="tx-contract-list" class="tx-contract-list"></div>
    </div>
    <div id="tx-players" class="tx-players" role="status" aria-live="polite"></div>
    <div id="tx-choose" class="tx-choose hidden">
      <p id="tx-choose-text" class="pc-row-label"></p>
      <div class="game-actions-row">
        <button id="tx-choose-king" class="secondary" type="button" data-contract="king" data-i18n="tx_contract_king">King of Hearts</button>
        <button id="tx-choose-queens" class="secondary" type="button" data-contract="queens" data-i18n="tx_contract_queens">Queens</button>
        <button id="tx-choose-diamonds" class="secondary" type="button" data-contract="diamonds" data-i18n="tx_contract_diamonds">Diamonds</button>
        <button id="tx-choose-tricks" class="secondary" type="button" data-contract="tricks" data-i18n="tx_contract_tricks">Tricks</button>
        <button id="tx-choose-trix" class="secondary" type="button" data-contract="trix" data-i18n="tx_contract_trix">Trix</button>
      </div>
    </div>
    <div id="tx-trick" class="dk-trick hidden" role="group" data-i18n-attr="aria-label:dk_trick_label" aria-label="Trick"></div>
    <div id="tx-rows" class="tx-rows hidden" role="group" data-i18n-attr="aria-label:tx_rows_label" aria-label="Trix rows"></div>
    <div class="game-actions-row">
      <button id="tx-pass" class="secondary hidden" type="button" data-i18n="tx_pass">Pass</button>
      <button id="tx-continue" class="primary hidden" type="button" data-i18n="tx_continue">Continue</button>
      <button id="tx-next-kingdom" class="primary hidden" type="button" data-i18n="tx_next_kingdom">Next kingdom</button>
      <button id="tx-end-game" class="secondary hidden" type="button" data-i18n="tx_end_game">End game</button>
    </div>
    <div id="tx-hand-cover" class="hand-cover hidden">
      <p id="tx-hand-cover-text"></p>
      <button id="tx-show-hand" class="primary" type="button" data-i18n="maumau_show_hand">Show my cards</button>
    </div>
    <div id="tx-hand" class="pc-row" role="group" data-i18n-attr="aria-label:schwimmen_hand_label" aria-label="Your cards"></div>
  </div>
</section>
